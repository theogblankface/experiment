<!DOCTYPE html>
<html lang="en">
<head> <!-- head is what contains machine-readable metadata/info for the document -->
    <meta charset="UTF-8"> <!-- meta represents metadata that cannot be represented by other HTML meta-related elements -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nostalgia Tour</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/holdingbacktears.jpg" type="image/x-icon" />
</head>

<body> <!-- body is what represents the content of an HTML document -->
    <audio autoplay> <!-- audio defines embedded sound content -->
        <source src="assets/audio/windowsxp.mp3" type="audio/mp3">
    </audio>
    <header role="banner" class="primary"> <!-- header represents introductory content, typically a group of introductory or navigational aids -->
        <h1>Welcome back to the good ol' days!</h1>
    </header>
    <div class="btrsound"> <!-- div defines a section in a document -->
        <a href="https://www.youtube.com/watch?v=0AwA5A1wE0o&list=RDEMtkhGzGjCmxChmxTD5ZACNg&start_radio=1" class="hoverLink">
            <img src="assets/img/bigtimerush.jpg" alt="Play Big Time Rush">
        </a> <!-- a creates a hyperlink to web pages, files, email addresses, locations within the current page, or anything else a URL can address -->
        <audio src="assets/audio/btr.mp3" class="enter">
            Your browser does not support the audio element.
        </audio>
    </div>
    <div class="robloxsound">
        <a href="https://www.roblox.com" class="hoverLink">
            <img src="assets/img/roblox.jpg" alt="Play Roblox Oof">
        </a>
        <audio src="assets/audio/oof.mp3" class="enter">
            Your browser does not support the audio element.
        </audio>
    </div>
    <script src="assets/js/script.js"></script>
</body>
</html>
